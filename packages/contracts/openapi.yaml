openapi: 3.1.0
info:
  title: BMS API
  version: 0.2.2
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: Active user bearer token required; web session identities are rejected.
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Member:
      type: object
      required: [id, role, user_id, name, email]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, operator, admin, owner] }
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    OrganizationAccess:
      type: object
      required: [id, name, role, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [viewer, operator, admin, owner] }
        permissions:
          type: array
          items: { type: string }
    Building:
      type: object
      required: [id, organization_id, name, code, address, timezone, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        address: { type: [string, 'null'], maxLength: 255 }
        timezone: { type: string, example: Europe/Paris }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BuildingInput:
      type: object
      required: [name, code, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        address: { type: [string, 'null'], maxLength: 255 }
        timezone: { type: string, example: Europe/Paris }
      example:
        name: North Office
        code: N-001
        address: 1 Example Street
        timezone: Europe/Paris
    BuildingPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        address: { type: [string, 'null'], maxLength: 255 }
        timezone: { type: string, example: Europe/Paris }
    Floor:
      type: object
      required: [id, organization_id, building_id, name, code, level, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        level: { type: integer, minimum: -2147483648, maximum: 2147483647, description: Signed level; negative values represent basements. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FloorInput:
      type: object
      description: Organization and building IDs come from the URL and are rejected in the body, including null or empty values.
      required: [name, code, level]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        level: { type: integer, minimum: -2147483648, maximum: 2147483647 }
    FloorPatch:
      type: object
      description: Parent IDs cannot be changed or supplied, including null or empty values.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        level: { type: integer, minimum: -2147483648, maximum: 2147483647 }
    Zone:
      type: object
      required: [id, organization_id, building_id, floor_id, name, code, zone_type, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        zone_type: { type: string, enum: [office, plant_room, common, retail, storage, other] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneInput:
      type: object
      description: Organization, building, and floor IDs come from the URL and are rejected in the body, including null or empty values.
      required: [name, code, zone_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        zone_type: { type: string, enum: [office, plant_room, common, retail, storage, other] }
    ZonePatch:
      type: object
      description: Parent IDs cannot be changed or supplied, including null or empty values.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        zone_type: { type: string, enum: [office, plant_room, common, retail, storage, other] }
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      summary: API process status
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                required: [service, version, status]
                properties:
                  service: { type: string, const: bms-api }
                  version: { type: string }
                  status: { type: string, const: ok }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a 12-hour bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, expires_at, user]
                properties:
                  token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid credentials or inactive user }
        '422': { description: Invalid input }
        '429': { description: More than five failed attempts per email and IP or twenty per IP in one minute }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: 'Missing, expired, or revoked bearer token; inactive user or web session' }
  /api/v1/auth/organizations:
    get:
      operationId: listCurrentUserOrganizations
      summary: List the active organizations accessible to the current user
      description: Returns only active memberships for the authenticated user. Roles and permissions are derived from the current server role mapping. Organization status is not modeled in M2.1.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Minimal organization access list; an empty list is valid
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationAccess' }
        '401': { description: 'Missing, invalid, expired, or revoked bearer token; inactive user or web session' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current token
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revoked }
        '401': { description: 'Missing, expired, or revoked bearer token; inactive user or web session' }
  /api/v1/organizations/{organization}/buildings:
    parameters:
      - name: organization
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listBuildings
      summary: List buildings within an authorized organization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Buildings ordered by code and ID, scoped to the organization
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Building' }
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without buildings.view }
        '404': { description: Organization is inaccessible or absent }
        '422': { description: Invalid pagination parameters }
    post:
      operationId: createBuilding
      summary: Create a building in an authorized organization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingInput' }
      responses:
        '201':
          description: Building created and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Building' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without buildings.manage }
        '404': { description: Organization is inaccessible or absent }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied organization_id' }
  /api/v1/organizations/{organization}/buildings/{building}:
    parameters:
      - name: organization
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: building
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBuilding
      summary: Get an authorized building
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Building within the authorized organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Building' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without buildings.view }
        '404': { description: Organization or building is inaccessible or absent }
    patch:
      operationId: updateBuilding
      summary: Update an authorized building
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildingPatch' }
      responses:
        '200':
          description: Building updated and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Building' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without buildings.manage }
        '404': { description: Organization or building is inaccessible or absent }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied organization_id' }
  /api/v1/organizations/{organization}/buildings/{building}/floors:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: building, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listFloors
      summary: List floors in an authorized building
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Floors ordered by code and ID
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Floor' } }
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without floors.view }
        '404': { description: Organization or building is inaccessible or absent }
        '422': { description: Invalid pagination parameters }
    post:
      operationId: createFloor
      summary: Create a floor under the authorized building
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FloorInput' }
      responses:
        '201':
          description: Floor created and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Floor' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without floors.manage }
        '404': { description: Organization or building is inaccessible or absent }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied parent IDs' }
  /api/v1/organizations/{organization}/buildings/{building}/floors/{floor}:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: building, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: floor, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFloor
      summary: Get a floor in the authorized building
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Floor detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Floor' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without floors.view }
        '404': { description: 'Organization, building, or floor is inaccessible or absent' }
    patch:
      operationId: updateFloor
      summary: Update a floor without changing its parent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FloorPatch' }
      responses:
        '200':
          description: Floor updated and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Floor' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without floors.manage }
        '404': { description: 'Organization, building, or floor is inaccessible or absent' }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied parent IDs' }
  /api/v1/organizations/{organization}/buildings/{building}/floors/{floor}/zones:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: building, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: floor, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listZones
      summary: List zones in an authorized floor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Zones ordered by code and ID
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Zone' } }
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without zones.view }
        '404': { description: 'Organization, building, or floor is inaccessible or absent' }
        '422': { description: Invalid pagination parameters }
    post:
      operationId: createZone
      summary: Create a zone under the authorized floor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneInput' }
      responses:
        '201':
          description: Zone created and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Zone' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without zones.manage }
        '404': { description: 'Organization, building, or floor is inaccessible or absent' }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied parent IDs' }
  /api/v1/organizations/{organization}/buildings/{building}/floors/{floor}/zones/{zone}:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: building, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: floor, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: zone, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getZone
      summary: Get a zone in the authorized floor
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Zone detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Zone' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without zones.view }
        '404': { description: 'Organization, building, floor, or zone is inaccessible or absent' }
    patch:
      operationId: updateZone
      summary: Update a zone without changing its parent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonePatch' }
      responses:
        '200':
          description: Zone updated and audited
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Zone' }
        '401': { description: 'Missing or invalid bearer token, or inactive account' }
        '403': { description: Active member without zones.manage }
        '404': { description: 'Organization, building, floor, or zone is inaccessible or absent' }
        '422': { description: 'Invalid fields, duplicate code, or client-supplied parent IDs' }
  /api/v1/organizations/{organization}/users:
    parameters:
      - name: organization
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrganizationUsers
      summary: List active organization members
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: role, in: query, schema: { type: string, enum: [viewer, operator, admin, owner] } }
      responses:
        '200':
          description: Paginated active members within the requested organization
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { description: Unauthenticated }
        '403': { description: Insufficient permission }
        '404': { description: Organization is not visible to user }
    post:
      operationId: inviteOrganizationUser
      summary: Request an organization invitation without revealing account existence
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                role: { type: string, enum: [viewer, operator, admin, owner] }
      responses:
        '202':
          description: One-time invitation token for local secure delivery, valid for 24 hours
          content:
            application/json:
              schema:
                type: object
                required: [message, invitation_token]
                properties:
                  message: { type: string }
                  invitation_token: { type: string }
        '401': { description: Unauthenticated }
        '403': { description: Insufficient permission or role too high }
        '404': { description: Organization is not visible to user }
        '422': { description: Invalid input }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept a one-time invitation with the invitee's password
      security: []
      description: Existing users supply their current password; new users choose a password. The token is one-time and expires after 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Invalid invitation or credentials }
        '422': { description: Invalid input }
        '429': { description: Too many attempts }
  /api/v1/organizations/{organization}/memberships/{membership}:
    parameters:
      - name: organization
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: membership
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMembershipRole
      summary: Change a lower-ranked member's role
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [viewer, operator, admin, owner] }
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required: [id, role]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [viewer, operator, admin, owner] }
        '401': { description: Unauthenticated }
        '403': { description: Insufficient permission }
        '404': { description: Organization or membership is not visible }
        '422': { description: Invalid role }
    delete:
      operationId: revokeMembership
      summary: Revoke a lower-ranked membership
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Membership revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { description: Unauthenticated }
        '403': { description: Insufficient permission }
        '404': { description: Organization or membership is not visible }
