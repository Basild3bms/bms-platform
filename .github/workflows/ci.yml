name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bms_ci
          POSTGRES_USER: bms
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bms -d bms_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, pdo_pgsql
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'bms_ci' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: bms
          DB_PASSWORD: ci-only
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BMS_EXPECT_DB_DRIVER: ${{ matrix.database }}
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Ensure Flutter Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=28.2.13676358
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK location is not configured" >&2
            exit 1
          fi
          ndk_dir="$sdk_root/ndk/$ndk_version"

          ndk_valid() {
            [[ -f "$ndk_dir/source.properties" && -x "$ndk_dir/ndk-build" ]] &&
              grep -Eq '^[[:space:]]*Pkg\.Revision[[:space:]]*=[[:space:]]*28\.2\.13676358[[:space:]]*$' "$ndk_dir/source.properties"
          }

          if ndk_valid; then
            echo "NDK $ndk_version is already installed and valid"
            exit 0
          fi

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$sdkmanager_bin" ]]; then
            echo "Android sdkmanager is unavailable" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if [[ -e "$ndk_dir" || -L "$ndk_dir" ]]; then
              echo "Removing incomplete NDK $ndk_version installation"
              rm -rf -- "$ndk_dir"
            fi
            echo "Installing NDK $ndk_version (attempt $attempt of 3)"
            if timeout 600 "$sdkmanager_bin" --sdk_root="$sdk_root" --install "ndk;$ndk_version" && ndk_valid; then
              echo "NDK $ndk_version installation verified"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "NDK $ndk_version installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          build_log="$(mktemp)"
          trap 'rm -f -- "$build_log"' EXIT

          for attempt in 1 2 3; do
            : > "$build_log"
            echo "Building Android debug APK (attempt $attempt of 3)"
            if flutter build apk --debug 2>&1 | tee "$build_log"; then
              exit 0
            fi

            if ! grep -Eiq 'repo\.maven\.apache\.org|repo1\.maven\.org' "$build_log" ||
              ! grep -Eiq '(^|[^0-9])429([^0-9]|$)|Too Many Requests' "$build_log" ||
              grep -Eiq '(^e: .*\.(kt|java):[0-9]+:|Compilation (failed|error)|Execution failed for task .*:(compile|test)|[0-9]+ tests? failed)' "$build_log"; then
              echo "Android build failed without a retryable Maven Central rate limit" >&2
              exit 1
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Android build still hit Maven Central HTTP 429 after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
